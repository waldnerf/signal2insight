  execution-time parsed use)
- Two-round batched LLM taxonomy induction with human validation
evaluation_methods:
- Paired bootstrap confidence intervals on matched success-rate deltas
- Precision/recall/F1 over parsed execution-time skill use against native ground-truth
  annotations
- Human-validated LLM-judge open-coding + taxonomy induction (Cohen's kappa reported)
