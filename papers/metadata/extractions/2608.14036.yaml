top_three_insights:
- Skills work mainly by stabilizing procedure (procedural anchoring, 65.7% of skill
  mechanisms), not by injecting missing knowledge (4.5%).
- Skill retrieval precision collapses from ~30% to ~3% as a skill pool grows from
  5 to 100 items, while downstream task success barely moves.
- 'Skills introduce a genuinely new failure mode absent from raw or workflow-memory
  execution: the agent has the right skill but misapplies or ignores it (10.0% of
  skill-arm cases vs <1% elsewhere).'
new_concepts:
- Procedural anchoring (skill mechanism)
- Skill-use taxonomy (SC1/SC2/SC3, 12 modes)
- Paired-triple contrastive trajectory analysis
- Offline vs. execution-time retrieval as independent measurements
terminology:
