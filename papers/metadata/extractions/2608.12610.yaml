summary_five_sentences: 'This paper argues that installing an agent skill bundles
  three functions that should be separate -- content delivery, persistence, and automatic
  triggering -- and that only the last actually requires occupying scarce system-prompt
  space. It measures the bottleneck across a July 2026 crawl of 56,804 published skills:
  resident auto-trigger capacity is bounded at well under 100 reliable slots per agent,
  forcing most of the public corpus into permanent unusability under install-only
  delivery. The authors propose @skills, an open protocol with three delivery tiers
  -- Reference (fetch at point of use, zero resident cost), Saved (vendored into a
  git-tracked project folder, still zero resident cost), and Installed (one line in
  a .gitignore-style trigger file, the only tier that costs prompt space). The design
  is deliberately minimal: no manifest, lockfile, registry, or change to the SKILL.md
  format itself, and integration requires either dropping in one instruction file
  or adopting a small reference CLI, and it is already implemented end to end in a
  production client (AdaL). The paper backs the design with ecosystem measurement
  (skill sizes, provider adoption, directory fragmentation across 75 coding agents)
  and a security discussion, positioning the protocol as complementary to, not a replacement
  for, existing install-based systems.'
executive_explanation: 'There are now 56,804 public ''skills'' (reusable instruction
  packages) that AI coding agents can use, but today''s delivery model means every
  one of them has to be permanently installed to be usable at all -- and an agent''s
  prompt only has room for about 100 of those before the AI starts getting confused
  and missing things. That ceiling has nothing to do with how good your skills are;
  it''s a side effect of how much text an AI model can reliably pay attention to at
  once. This paper proposes a fix: let most skills be fetched only when actually needed
  (costing nothing until then), and reserve permanent ''always loaded'' status for
  the handful that truly must fire automatically. It''s a shipped, working tool, and
  the core insight -- separate ''can I use this'' from ''is this always loaded'' --
  is a design pattern CIOs/CTOs should apply to any growing library of AI instructions
  their teams maintain, not just this one protocol.'
architect_explanation: 'The paper''s central claim is a scarce-attention-budget argument:
  an installed skill''s description sits permanently at the top of the context window,
  subject to (1) distance decay (positional attention bias), (2) a standing token
  tax paid on every message (50-280 tokens/skill measured), and (3) dilution (instruction-following
  degrades as concurrent instructions accumulate, citing a 68%-adherence-at-500-constraints
  result). These jointly bound reliable auto-trigger capacity to well under 100 slots,
  while 56,804 skills compete for it. The fix is a three-tier delivery model: Tier
  1 (Reference, `@skills:<path>`, injected at the end of context adjacent to the task
  -- the highest-attention position -- with zero standing cost), Tier 2 (Saved, vendored
  into a git-tracked `.atskills/` directory, indexed by tooling not the prompt, zero
  resident cost), and Tier 3 (Installed, one line in a `.autotrigger` file, frontmatter-only
  residency). Resolution is local-first through a validating cache over git as transport;
  no manifest, lockfile, or version pinning exists; shipped as `npm i atskills` and
  implemented end-to-end in AdaL.'
central_contribution: An open, shippable protocol that separates a skill's content,
  persistence, and auto-triggering into three independently decidable tiers, removing
  the forced default of permanent prompt residency for every published skill, backed
  by ecosystem measurement quantifying the scale of the problem it solves.
industry_problem: As organizations and the open ecosystem accumulate agent skills
  (tens of thousands publicly, more privately), the install-everything delivery model
  means every skill permanently taxes the AI's limited attention budget, and only
  a small fraction of any skill library can realistically be kept installed -- so
  most of an organization's or the ecosystem's skill investment goes unused.
problem_importance: 'This is a structural ceiling, not a fixable configuration problem:
  resident-context capacity is argued (with supporting literature on positional attention,
  instruction-density degradation, and multi-turn decay) to be a physical property
  of how transformer attention works, not a design mistake teams can engineer around
  by being more careful about what they install.'
assumptions_challenged: Challenges the assumption that 'install' is the right unit
  for making a skill usable at all; challenges the package-manager mental model (registry/install/update)
  as the right analogy for prompt content, since code costs nothing until called but
  a resident description costs attention on every message; and challenges the idea
  that auto-triggering is inherently valuable for every skill.
gaps_identified: Existing systems (MCP, plugin marketplaces, per-agent skill directories)
  all still require installing content to make it usable at all, and none separate
  'can this be used' from 'is this always loaded' -- fragmentation is compounded by
  54 different project-level and 58 different user-level storage conventions across
  75 coding agents, none of which addresses the underlying attention-budget problem.
proposed_architecture: 'A three-tier delivery model implemented as four filesystem
  primitives: a reference syntax (`@skills:<path>`, addressing any skill, subtree,
  or collection), a project folder (`.atskills/`) for vendored/saved copies, a `.gitignore`-style
  trigger file (`.autotrigger`) that is the only thing costing prompt residency, and
  a two-line provenance stamp (`.source`). Resolution is local-first (a saved copy
  always answers its own path) then falls back to a machine-wide validating cache
  over git (a single revision probe decides serve-cached / fetch-fresh / serve-stale-offline).
  No manifest, lockfile, database, or version pinning exists anywhere.'
differentiation: Unlike install-based marketplaces/plugins (which bundle content+persistence+triggering
  into one all-or-nothing action) and unlike the closest prior tool (skills.sh's `use`
  command, which resolves exactly one skill per call and caches nothing), @skills
  addresses any granularity as a menu, composes multiple references in one message
  deterministically, and decouples 'keep a copy' from 'make it fire automatically'
  as two independent, combinable decisions.
novel_concepts: The three-tier delivery model (Reference / Saved / Installed) as a
  decomposition of what 'installing' used to mean; the `.autotrigger` file as a `.gitignore`-analogous,
  fully reviewable representation of an agent's entire resident-prompt budget; 'install
  is a line' as a design principle; reframing auto-trigger capacity as a scarce, countable
  attention budget rather than a UX nicety.
improves_upon: Improves over plugin/marketplace-based skill installation (all-or-nothing,
  per-agent fragmented across 54+58 storage conventions) and over the closest non-installing
  alternative, skills.sh's `use` command (single-skill resolution only, no caching,
  no composition).
tradeoffs: Tier 1 (Reference) puts a network round-trip on the critical path for cloud-sourced
  skills (mitigated but not eliminated by a validating cache); the protocol offers
  no version pinning by design, so a referenced skill can change under a team without
  notice unless explicitly saved; and the core capacity claim (fewer than 100 reliable
  auto-trigger slots) is bounded by argument and literature rather than directly,
  controllably measured by the authors.
evaluation_method: 'Primarily a systems/design paper backed by ecosystem measurement
  rather than a controlled experiment: a July 2026 crawl of 56,804 skills across 1,133
  GitHub repositories (56,245 bodies fully fetched), a 100-skill classification sample
  (~10pp margin at 95% CI), one measured production working setup (18 skills) for
  token-cost figures, and a literature synthesis for the attention-budget capacity
  bound.'
statistically_convincing: The corpus-scale measurements (skill counts, sizes, directory
  fragmentation, provider concentration) are full-corpus and solid. Classification
  percentages come from a 100-skill sample with an explicitly stated ~10-point margin
  of error. The central capacity claim -- fewer than 100 reliable auto-trigger slots
  -- is explicitly not directly measured by the authors; it's argued from cited literature
  plus one real working setup's token measurements, a limitation the paper itself
  flags.
evaluation_weaknesses: The authors state plainly that no controlled experiment isolating
  trigger reliability as a function of installed-skill count exists yet (proposed
  as future work); token-cost figures come from a single real working setup, not a
  survey; and the paper discloses the author founded the company (SylphAI) that operates
  the AdaL client and atskills.one hub it advocates for -- a disclosed conflict of
  interest readers should weigh in judging market-adoption claims.
open_questions: How trigger reliability actually degrades as a function of installed-skill
  count (proposed but not run); how compliance varies with injection position specifically
  for skill-sized instructions (proposed but not run); whether future architectures
  or harness-side calibration could reduce the positional-attention bias the whole
  argument rests on.
enterprise_meaning: Any organization building an internal library of AI agent skills/playbooks
  will hit the same wall this paper describes -- a growing library taxes every agent
  conversation whether or not the skill is relevant that turn, and only a small number
  of skills can be always-on before instruction-following measurably degrades. The
  design pattern (separate reachable from always-loaded, reserve auto-trigger for
  a small essential set) applies even without adopting this specific protocol.
enterprise_patterns_affected: Agent design and prompt/context management -- how organizations
  structure, store, and activate reusable instructions for AI agents at scale, and
  the operational governance of a growing internal skill/playbook catalog.
reduces_cost: Yes directly -- moving most skills out of permanent residency removes
  their per-message token tax entirely (measured at 50-280 tokens/skill, ~1,500-2,000
  tokens of standing overhead for an 18-skill installed set), a straightforward inference-cost
  reduction at scale.
improves_reliability: Yes -- by keeping the resident prompt lean and injecting full
  skill content at the end of context (the highest-attention position) rather than
  the top (subject to positional decay), the design should reduce the instruction-following
  degradation the paper documents as endemic to install-heavy setups.
improves_governance: 'Yes, notably: the `.autotrigger` file makes an agent''s entire
  ''what fires automatically'' surface a single reviewable, diffable file (a one-line
  change per skill, reviewable in a pull request like code), and the proposed `/skills`
  ''view prompt'' feature shows exactly what text the model receives -- both concrete
  governance wins over opaque per-agent install directories.'
improves_developer_productivity: Yes -- eliminates per-agent installation fragmentation
  (54 project-level and 58 user-level storage conventions across 75 agents) and lets
  a team maintain one skill library instead of duplicating it per agent.
cio_action: Before greenlighting a large investment in an internal AI-skill/playbook
  library, ask how the team plans to keep that library findable and cheap as it grows
  past a few dozen entries -- 'install everything' does not scale past roughly a hundred
  items regardless of tooling.
ai_team_action: Audit the current set of installed/always-loaded skills or system-prompt
  instructions across your agent fleet, split them into 'must fire unprompted' (small,
  deliberately curated) versus 'fine to fetch on demand,' and stop defaulting new
  playbooks to permanent installation.
surprising_claim: That the fix for AI agents forgetting or ignoring installed instructions
  isn't better retrieval or bigger context windows -- it's removing most content from
  the resident prompt entirely and fetching it only at the exact moment it's needed,
  at the position in context where attention is empirically highest.
misconceptions_challenged: Challenges the assumption that 'more installed skills =
  more capability'; challenges the assumption that permanent installation is the only
  way to make a skill usable; and challenges the package-manager framing as the right
  mental model for managing AI instruction content.
business_implications: Enterprises standardizing on AI coding agents should treat
  'which instructions are always loaded' as a deliberately governed, size-capped list
  (the paper argues for single digits to a few dozen), not an ever-growing convenience
  list, and should build or adopt tooling that lets the rest of an instruction library
  be fetched on demand.
future_trends: Expect agent tooling broadly (not just skills) to move toward this
  same reference-vs-resident split -- the paper draws the parallel to how production
  agents already load deferred tool schemas by search rather than keeping them all
  resident, suggesting the pattern will generalize to tool definitions, MCP servers,
  and other prompt-competing content.
future_research_to_monitor: Controlled studies isolating trigger reliability as a
  function of installed-skill count (proposed but not run); compliance-vs-injection-position
  studies for skill-sized instructions; and adoption data on whether reference/usage-based
  counting changes author publishing behavior, as the paper predicts.
worth_linkedin_post: Yes -- 'install less, use more' and the 56,804-skills-vs-100-slots
  framing are both highly quotable, and this paper pairs naturally with the companion
  paper for a two-part storyline.
worth_long_article: Yes, in combination with the companion paper -- one measures the
  problem (retrieval collapses as skill libraries scale), the other proposes an architectural
  fix for the root cause (don't make everything resident in the first place).
strongest_narrative: Every AI agent has a hard, physics-like ceiling on how many instructions
  it can reliably keep in mind at once -- well under 100 -- and the standard way of
  giving agents new capabilities (installing them) assumes that ceiling doesn't exist,
  which is why organizations end up with skill libraries most of which never actually
  fire.
key_takeaway: Treat 'always loaded' as a scarce, deliberately governed budget for
  AI agent instructions (tens of slots, not thousands), and fetch everything else
  on demand -- the fix for a bloated, unreliable skill library is architectural, not
  just better content.
