top_three_insights:
- Installing a skill bundles three separate decisions -- get the content, keep a copy,
  and make it fire automatically -- and only the third needs to cost anything in the
  prompt.
- The ecosystem's real capacity for skills that fire automatically is a hard ceiling
  of well under 100 slots per agent, regardless of tooling, so a skill catalog's growth
  strategy cannot be 'install more.'
- Making the auto-trigger list a single reviewable, diffable text file (like .gitignore)
  turns invisible prompt bloat into something a team can audit like code.
new_concepts:
- Three-tier skill delivery model (Reference / Saved / Installed)
- Attention budget as a countable resource for auto-triggering
- Install-as-a-line (.autotrigger as a .gitignore-analogous reviewable file)
- Trigger-engineering
terminology:
- Reference tier / Saved tier / Installed tier
