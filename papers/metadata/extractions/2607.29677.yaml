top_three_insights:
- Frontier vision-language models fall off a cliff on long documents, with Gemini
  3.5 Flash dropping from 87.9% to 27.9%, because systems without an iteration strategy
  silently truncate long record lists rather than failing visibly. Short-document
  benchmark performance is therefore close to worthless as a predictor for the documents
  that carry the most value.
- Price does not predict quality within a model family. Gemini stayed essentially
  flat from 0.17 to 3.83 cents per page, Claude was non-monotonic across its three
  tiers, and only GPT scaled monotonically, where the flagship cost nearly ten times
  the mid-tier for 3.5 more F1 points. The quality-cost frontier has to be measured,
  not inferred.
- 'Source traceability is the sector''s weakest link: commercial VLMs and coding agents
  return no word-level boxes at all, and even specialised systems built to return
  them stay below 50% word-level grounding F1, which directly constrains any workflow
  where a human must audit the output.'
new_concepts:
- Evidence lists with OR-acceptance for ambiguous fields
- Grounding scored conditionally on value correctness
- Challenge tagging across task, perception, table structure, domain and length
- Measured per-page cost as a scored evaluation dimension
- Keeping rejections and failures in the denominator as an end-to-end robustness measure
terminology:
- Schema-guided extraction
- Key information extraction (KIE)
- Order-insensitive value F1
- Word-level and page-level grounding F1
- Long-record completeness
- Needle-in-haystack extraction
- Perception challenge
- Truncation failure
- Quality-cost frontier
architectural_patterns:
- Iterative or chunked traversal of long documents rather than single-pass generation
- Multi-provenance ground truth (cross-system adjudication, known-before-render synthesis,
  human field verification)
- Challenge-tagged evaluation sets supporting per-dimension diagnosis rather than
  aggregate scoring
- Scoring evidence and value jointly so correct provenance for a wrong answer earns
  nothing
- Failures retained in the denominator to measure end-to-end rather than conditional
  performance
evaluation_methods:
- Order-insensitive value F1 for structured output
- Word-level grounding F1 at fixed IoU with correctness precondition
- Per-challenge-tag stratified breakdown
- Within-family quality-cost scaling curves across model tiers
- Cost measured from actual token or credit consumption against published rates
- OR-acceptance scoring against multi-reading evidence lists
