top_three_insights:
- '''Oversight degrades the overseer'': the act of supervising an agent erodes the
  attention, situational awareness and domain skill supervision depends on, so oversight
  hollows out even while the approve button is still being pressed.'
- 'Degraded human approval is a corrupted training signal: preference-based training
  optimized against tired, out-of-the-loop raters can produce agents that reward the
  conditions of their own weak oversight (more fluent summaries, less friction, oversimplified
  plans).'
- 'Oversight quality is measurable: falling review time at constant approval rate,
  a declining override rate as complexity rises, and reviewers who stop asking for
  evidence are all detectable signatures of decaying oversight.'
