summary_five_sentences: 'AI coding agents now produce diffs faster than human reviewers
  can absorb them, and the first generation of AI review tools made the gap worse
  by commenting on style instead of correctness. Meta analysed 18,000 human code reviews
  and derived a six-theme taxonomy showing reviewers overwhelmingly act on Correctness
  and Reliability (44.4%), Code Quality (19.2%) and Security (19.1%). Measured against
  that baseline, current AI reviewers under-index on Security by 89.5% and on Correctness
  by 42.6% while over-indexing on Code Design (+350%) and Best Practices (+328%).
  ARCTIC reframes review around three signals: intent prediction (why the change was
  made, 0.86 F1), drift detection (how far the agent''s output diverged from that
  intent, QWK 0.907 against human annotators), and spotlight (which regions deserve
  scrutiny, 2.4x the baseline reviewer''s quality estimation at 5x fewer tokens).
  In a Spring 2026 rollout, showing authors their drift score reduced code misalignment
  by a further 5.76 points beyond normal iteration (p=0.026), intent predictions drew
  90.2% approval, and no defects have been attributed to self-reviewed diffs across
  more than a million API requests.'
executive_explanation: 'Your engineers are shipping code an AI wrote, and the review
  process that used to catch problems assumes a human wrote it. This paper measures
  the gap and closes part of it. The key measurement is that today''s AI review tools
  spend their attention almost exactly where human reviewers do not: they generate
  ten times more style and design commentary than humans care about, and almost no
  security commentary at all, at a moment when the volume of unreviewed code is climbing.
  Meta''s answer is not a better line-by-line commenter but a different question:
  did the agent build what the developer actually asked for, and where should a human
  look to check? Making that divergence visible changed author behaviour on its own,
  which is the part that transfers regardless of tooling.'
architect_explanation: ARCTIC is a platform API serving four independent signals (Intent,
  Drift, Spotlight, Diff Categorization) that downstream surfaces consume selectively,
  organised as a Forest view (intent, milestones, drift) over a Trees view (region-level
  critique). Intent prediction is a structured extraction over developer/agent conversation,
  change metadata, agent plans and linked artifacts, deliberately excluding the diff
  itself to avoid circularity; an agentic multi-turn variant reaches 0.860 F1 versus
  0.844 zero-shot at 6.4x the tokens, so zero-shot is the sane default. Drift is computed
  by backtranslating the diff into a task list and scoring it against the inferred
  intent on a five-bucket 0-100 rubric, penalising only harmful unrequested changes.
  Spotlight is a non-agentic two-stage generate-then-critique reviewer whose critic
  enforces claim correctness, intent fit, framework rules, actionability and a senior-engineer
  bar, emitting only surviving regions ranked by severity. The taxonomy from RQ1 is
  what steers all of it, which is why it beats a comment-everywhere baseline at a
  fifth of the token cost.
central_contribution: A measured taxonomy of what human reviewers actually act on,
  the demonstration that current AI code review is misaligned with it by large margins,
  and a three-signal system (intent, drift, spotlight) that reframes review around
  agent-intent alignment rather than line-by-line commentary, validated in production
  at Meta.
industry_problem: AI coding agents generate multi-file changes at a volume and speed
  that exceeds peer review capacity, and external data shows most large code changes
  now ship with no formal review at all. Simultaneously, agents deviate from the developer's
  stated goal (agentic drift) and no existing review tooling has any mechanism to
  detect that.
problem_importance: Code review is the last control point before AI-authored code
  reaches production, and it is quietly failing under load. Every organisation adopting
  coding agents is accumulating unreviewed change at a rate its review process was
  never designed for, and the AI tools bought to fill the gap are demonstrably pointed
  at the wrong problems, generating 30.8% of their output on best-practice nits and
  2.0% on security. That is a governance exposure, not a developer-productivity footnote.
assumptions_challenged: That peer review scales with code volume; that more AI review
  comments means better review; that the useful unit of review is the line rather
  than the intent; that an AI reviewer's value can be judged on comment count or resolution
  rate rather than on whether its output distribution matches what reviewers act on.
  It also challenges the assumption that AI-authored code needs more human review,
  showing that the right signals let authors self-review safely.
gaps_identified: No principled taxonomy of review concerns against which AI reviewers
  could be measured for coverage; no mechanism anywhere in existing review workflows
  to detect divergence between developer intent and agent output; no technique for
  extracting developer intent directly from coding-agent trajectories at scale; and
  attention-direction work that operates at file level or ranks comments, but not
  at the region level guided by what reviewers actually act on.
proposed_architecture: A modular platform API with two vantage points. The Forest
  layer infers intent from conversation logs, metadata, agent plans and linked artifacts
  (excluding the diff), then detects drift by backtranslating the diff into a natural-language
  task list and scoring divergence on a five-bucket 0-100 rubric across intent satisfaction
  and unrequested changes. The Trees layer runs Spotlight, a two-stage generation-then-critic
  reviewer that proposes candidate regions across five taxonomy categories and keeps
  only those passing five validation criteria, emitting category, severity and rationale
  per region. Both are grounded in the Foundation layer, a six-theme taxonomy derived
  from 18,000 human reviews. Signals feed a self-review experience where authors attest
  and land via a streamlined path, or are routed to deferred peer review when drift
  is high.
differentiation: 'Prior AI review systems generate line-level comments without distinguishing
  high-value from low-value findings, and prior attention-direction work scores files
  or ranks comments. ARCTIC differs on three axes: it derives its priorities empirically
  from what reviewers acted on rather than assuming them, it measures intent-to-output
  divergence as a continuous score rather than a binary misbehaviour classification,
  and it operates at the region level within files. The self-review workflow is also
  a different product shape: the signals go to the author before review rather than
  to the reviewer after.'
novel_concepts: Code critique as distinct from code review; the Forest/Trees decomposition;
  agentic drift as a continuously scored, backtranslation-derived quantity rather
  than a binary label; intent extracted from agent trajectories rather than stated
  by the developer; taxonomy-guided region prioritisation; and self-attestation as
  a landing path gated on quality signals.
improves_upon: AutoCommenter at Google (40% comment resolution), CodeReviewer pre-training
  for review generation, file-level risk scoring, and comment-ranking approaches such
  as CommentFinder. It also complements Wink's binary misbehaviour classification
  for coding agents by replacing it with a graded score, and operationalises Storey's
  notion of intent debt into something measurable.
tradeoffs: The agentic intent predictor buys 0.016 F1 for 6.4x the tokens and 2.3x
  the latency, which mostly argues for zero-shot. Drift detection is reliable at the
  extremes but weak in the middle buckets (Moderate F1 0.341, Significant 0.409),
  so it discriminates well-aligned from severely drifted diffs and blurs the middle.
  Self-review raises the revert rate from a 0.17% baseline to 0.33%, accepted as within
  bounds for early access. And the whole stack leans on LLM-as-a-Judge for intent,
  drift and semantic grading, validated against humans but still exposed to systematic
  judge bias.
evaluation_method: 'Five research questions evaluated separately, then a live progressive
  rollout. Taxonomy derived from 18,000 human-reviewed diffs plus 712 accepted AI
  reviews via LLM extraction, 40 rounds of consolidation and two-researcher manual
  validation. AI review gap measured by tagging 2,000 sampled AI reviews against the
  taxonomy and computing relative difference from the human baseline. Intent prediction
  benchmarked on 121 AI-generated diffs with manually annotated ground truth, scored
  by LLM-as-a-Judge pairwise semantic similarity above 0.5. Drift benchmarked on 118
  diffs deliberately balanced across all five buckets (18-31 per bucket) with human
  annotations. Spotlight evaluated on CRBench, roughly 300 diffs split 70/30 problematic/clean,
  stratified to match the empirical distribution of human review-comment categories.
  Live: a quasi-experimental drift trend study over 247 consecutive version pairs
  filtered to 193, plus adoption and guardrail metrics.'
statistically_convincing: 'Mostly yes, with one soft spot. The offline results are
  strong and appropriately measured: QWK 0.907 with MAE 10.31 on a deliberately balanced
  five-bucket benchmark is a well-constructed evaluation, and the clean slice of CRBench
  is drawn from the same population as the positives rather than from arbitrary unreviewed
  code, which is a better negative class than most such benchmarks use. The headline
  production claim is the weakest link: the 5.76-point additional drift reduction
  is significant one-sided at p=0.026 with a small effect size (d=-0.28) and only
  marginal under Mann-Whitney (p=0.063), on self-selected groups. The taxonomy and
  gap measurements are descriptive and large-sample, and the finding that accepted
  AI reviews mirror the human distribution is a genuinely well-designed control.'
evaluation_weaknesses: 'The drift trend study is quasi-experimental with acknowledged
  self-selection: authors who used the new interface chose to, and may be more engaged
  or working on easier-to-align diffs. Everything is from a single engineering environment
  with one codebase, toolchain and review culture. Intent, drift and Spotlight precision
  all rest on LLM judges. CRBench filters ground truth to comments determinable from
  the diff alone, which the authors note inflates precision for both systems. Absolute
  precision and recall for Spotlight remain low (0.108/0.097 on problematic diffs)
  even where it beats the baseline three-fold. And the data cannot be released, so
  none of it is externally reproducible.'
open_questions: Whether the taxonomy distribution holds outside Meta's codebase and
  review culture. Whether the drift effect survives a randomised assignment rather
  than interface self-selection. Whether the 37% eligibility-to-attestation conversion
  is a UX problem or a trust problem. Whether the slightly elevated revert rate for
  self-reviewed diffs stays flat as the eligible population widens. And whether intermediate
  drift buckets can be made discriminative or are inherently fuzzy.
enterprise_meaning: 'Any organisation deploying coding agents is running an unmeasured
  control gap, and this paper gives the first credible way to size it. The immediate
  implication is not to buy a better AI reviewer but to ask what your current one
  is actually commenting on: if its output is 30% best practices and 2% security,
  it is consuming reviewer attention without covering the risk. The second implication
  is that intent alignment, not code correctness, is the reviewable unit for agent-authored
  work, and that measure can be surfaced to the author rather than the reviewer, which
  is where it changed behaviour. Third, self-review gated on quality signals is now
  an evidenced operating model rather than a proposal, with a defect record and a
  revert rate to argue from.'
enterprise_patterns_affected: Software change governance and audit trails; AI-assisted
  development rollout programmes; engineering capacity planning, since the constraint
  moves from writing code to reviewing it; security review coverage, given the measured
  89.5% under-indexing; and agent evaluation practice generally, since intent-versus-output
  backtranslation is a pattern that applies well beyond code.
reduces_cost: Yes, on two counts with hard numbers. Spotlight delivers better triage
  and localisation at roughly 5x fewer tokens and 6x lower latency than the baseline
  reviewer, bringing time-to-first-review from nearly six minutes to under one. Separately,
  zero-shot intent prediction costs 8,089 tokens against 52,191 for the agentic variant
  for 0.016 F1 less, so the cheap path is the right default for most diffs. The larger
  saving is reviewer time reallocated away from diffs that do not need it.
improves_reliability: 'In the rollout, no defects were attributed to any self-reviewed
  diff, though the revert rate was slightly elevated (0.33% vs 0.17% baseline). The
  stronger reliability argument is behavioural: making drift visible reduced misalignment
  by an additional 5.76 points beyond what iteration produced on its own, meaning
  the signal changes what ships rather than just describing it.'
improves_governance: Substantially. It creates an auditable record of what a change
  was intended to do, how far the delivered code diverged from that intent, and which
  regions were flagged for scrutiny, for changes where the author was an agent rather
  than a person. That is the artifact most change-control frameworks currently lack
  for AI-generated code, and the taxonomy gives a defensible basis for arguing review
  coverage rather than review volume.
improves_developer_productivity: 'Yes, through attention allocation rather than raw
  speed. 76% of self-attested diffs landed via a streamlined path without upfront
  peer review, and reviewers who do engage are directed at ranked regions instead
  of reading every changed line. The bottleneck the paper reports is conversion, not
  value: only 37% of eligible diffs complete the self-review flow.'
cio_action: Audit what your AI code review tool is actually commenting on, categorised
  against the concerns your engineers act on, before renewing or expanding it. Then
  decide explicitly whether agent-authored changes require a different control than
  human-authored ones, and what evidence you would need to let them land without upfront
  peer review. Treat intent-to-output divergence as a reportable metric for AI-assisted
  delivery, the same way you would treat change failure rate.
ai_team_action: Instrument intent capture at the point the agent is prompted, not
  retrospectively, and start scoring backtranslated diffs against it. Default to zero-shot
  intent extraction and reserve agentic extraction for complex changes. Replace comment-everywhere
  review prompts with a taxonomy-guided generate-then-critic pass that only surfaces
  findings passing an explicit acceptance bar. Expect the middle of any drift rubric
  to be unreliable and design the workflow around the confident extremes.
surprising_claim: That AI code review tools generate almost no security commentary
  at all (2.0% of output against 19.1% of human review activity, an 89.5% shortfall)
  while spending nearly a third of their output on best-practice nits, and that this
  is a property of what the systems generate rather than of what engineers will accept.
misconceptions_challenged: That the problem with AI code review is comment quality
  rather than comment distribution. That more automated comments means better coverage,
  when prior work already showed 73.8% of automated comments get resolved while PR
  closure time rises. That AI-authored code needs heavier human review, when the evidence
  here is that the right upfront signals let authors self-review with no attributed
  defects. And that agentic drift is a binary failure to be caught rather than a continuous
  quantity to be managed.
business_implications: 'The review bottleneck is now the binding constraint on AI-assisted
  engineering throughput, and it is a governance exposure as much as a productivity
  one. Organisations can no longer treat AI review tooling as a commodity add-on:
  its output distribution needs auditing against what its own reviewers act on, because
  a tool that is 2% security is not covering the risk it is bought to cover. Meanwhile
  the intent-drift-spotlight decomposition creates the audit artifact that regulated
  change control needs for agent-authored work, which turns a compliance blocker into
  a solvable measurement problem.'
future_trends: Review shifts from inspecting output to verifying alignment with intent,
  and the reviewable artifact becomes the trajectory rather than the diff. Expect
  intent capture to move upstream into the prompting interface, drift scoring to become
  a standard gate in delivery pipelines alongside test coverage, and self-attestation
  with signal-based eligibility to become a normal landing path. The same backtranslation
  pattern will spread from code to any agent output where the request and the deliverable
  can both be expressed in language.
future_research_to_monitor: Randomised rather than self-selected evaluations of whether
  surfacing alignment signals changes author behaviour. Whether review-concern taxonomies
  replicate outside a single engineering culture. Work on making intermediate drift
  categories discriminative. Storey on intent and cognitive debt, and Nanda et al.
  on coding-agent misbehaviour recovery, as the two nearest research lines.
worth_linkedin_post: 'Yes, and it is the strongest single post in this week''s batch.
  The hook is one number: AI code review tools produce 2% security commentary where
  human reviewers produce 19%. That lands without any setup, is verifiable, and immediately
  implies an action the reader can take on Monday.'
worth_long_article: 'Yes. There is enough here for a full piece on why the review
  layer, not the generation layer, is the binding constraint on AI-assisted engineering:
  the taxonomy evidence, the misalignment measurement, the intent/drift reframing,
  and a production rollout with adoption and guardrail numbers. The honest caveats
  (single environment, self-selection, LLM judges) are themselves useful material
  for a piece aimed at readers who are being sold AI review tools.'
strongest_narrative: 'Everyone is measuring how fast AI writes code. The number that
  matters is that the review process meant to catch its mistakes is pointed almost
  exactly where the mistakes are not: 2% of AI review commentary is about security,
  against 19% of what human reviewers actually act on. Meta measured the gap across
  18,000 reviews, then closed part of it by asking a different question entirely,
  not is this code correct, but did the agent do what you asked, and where should
  you look.'
key_takeaway: When agents write the code, the reviewable question stops being is this
  correct and becomes did the agent do what was asked, and where should a human look
  to verify. Organisations that keep buying line-by-line AI reviewers are optimising
  a control that no longer matches the risk.
