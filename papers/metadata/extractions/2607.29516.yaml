top_three_insights:
- 'Current AI code review is misaligned with human reviewer priorities in a measurable,
  large way: 89.5% under-indexed on security and 42.6% on correctness, while over-indexing
  on best practices by 328% and code design by 350%. The gap is in what these systems
  generate, not in what engineers will accept, since accepted AI reviews mirror the
  human distribution almost exactly.'
- Intent-to-output divergence for AI-authored code can be measured reliably (QWK 0.907,
  MAE 10.31) by backtranslating the diff and comparing it against intent inferred
  from the agent's own trajectory, and simply showing that score to the author reduced
  misalignment by a further 5.76 points beyond normal iteration.
- A taxonomy-guided, region-focused reviewer beat a comment-everywhere baseline by
  2.4x on quality estimation and 3.3x on defect localisation while using 5x fewer
  tokens and running 6x faster, which reframes AI review cost as an attention-allocation
  problem rather than a model-capability one.
new_concepts:
- Code critique (as distinct from code review)
- Agentic drift as a continuously scored quantity
- Forest and Trees review decomposition
- Backtranslation-based drift measurement
- Code spotlight (region-level review-worthiness ranking)
- Self-attestation as a signal-gated landing path
- Intent debt
terminology:
- Intent prediction
- Agentic drift
- Backtranslation
- Did Not Follow (DNF) drift
- Unrequested Changes (UC) drift
- Quality Estimation (QE)
- Defect Localization (DL pass@5)
- Quadratic Weighted Kappa (QWK)
- Time To First Review (TTFR)
- Eligibility-to-attestation conversion
architectural_patterns:
- Signals-as-independent-platform-APIs consumed selectively by downstream surfaces
- Generate-then-critic two-stage review with an explicit acceptance bar
- Backtranslate-and-compare for measuring output-vs-request divergence
- Excluding the artifact under evaluation from the inference that will judge it, to
  avoid circularity
- Empirically derived taxonomy as the steering prior for a generative system
evaluation_methods:
- Deliberately balanced ordinal benchmarks for per-bucket evaluation rather than naturally
  skewed samples
- Matched negative class drawn from the same population (later clean versions of previously
  flagged diffs)
- Relative-difference distribution comparison between AI output and human behaviour
  baselines
- Quadratic Weighted Kappa for ordinal agreement with off-by-one tolerance
- Quasi-experimental interface-exposure comparison with explicit self-selection disclosure
