top_three_insights:
- AI agent governance should scale with a specific four-dimension profile (autonomy,
  efficacy, goal complexity, generality), not with a single 'how agentic is it' score.
- Adding tool use, memory, or reasoning to an existing agent can silently shift its
  governance requirements -- profiles are not fixed at build time.
- The same overall risk level can call for very different governance mechanisms depending
  on which dimension drives it -- a narrow, high-goal-complexity system needs different
  controls than a broad, low-complexity one.
