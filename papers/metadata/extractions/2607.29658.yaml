architectural_patterns:
- Recursive group-then-abstract construction of a knowledge hierarchy from execution
  logs
- Stage-indexed retrieval so guidance matches the phase of work
- Retrieve-then-adapt, generating a context-specific plan rather than injecting retrieved
  text verbatim
- Retaining multiple granularities simultaneously rather than choosing one summarisation
  level
- Prompt-level augmentation that leaves the host agent's code and tools untouched,
  enabling cross-scaffold transfer
evaluation_methods:
- Ablation across representation granularity to isolate what makes reuse work
- Cross-scaffold transfer as a test of whether learned knowledge is agent-agnostic
- Difficulty-stratified subset sampling to concentrate analytical power where design
  choices show
- Manual gain and regression categorisation with independent double-labelling and
  Cohen kappa
- Temporal restriction of the historical candidate pool to prevent leakage
