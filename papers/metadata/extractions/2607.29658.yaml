top_three_insights:
- 'Raw agent trajectories transfer badly as reference material: replacing the abstraction
  hierarchy with raw logs dropped resolution from 80.0% to 57.6%, a 22.4-point cost
  for the same underlying information stored unstructured.'
- No single level of abstraction is sufficient. Low-level-only reached 64.0%, medium
  60.8% and high 58.4% against 80.0% for the mixture, and counterintuitively the general
  principles transferred worst because they lacked grounding for direct action.
- Procedural plans learned on one agent scaffold transferred to a structurally different
  agent with no modification, raising Pass@1 from 75.8% to 81.0% while reducing token
  usage, which indicates the knowledge captured is agent-agnostic rather than scaffold-specific.
new_concepts:
- Procedural knowledge nodes
- Stage-indexed multi-level trajectory abstraction tree
- Guidance versus plan distinction
- Paired LLM grouping and abstraction operators applied iteratively
- Cross-scaffold plan transfer
terminology:
- Hierarchical trajectory abstraction
- Procedural knowledge
- Repair stages (localisation, planning, execution-and-verification)
