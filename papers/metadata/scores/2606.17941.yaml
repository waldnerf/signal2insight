enterprise_problem: Pricing and trade-promotion planning across a large product portfolio
  and many markets is too high-dimensional for spreadsheets and expert intuition,
  and each geography solves it differently, so decisions influencing billions in revenue
  are made inconsistently and below optimum.
headline: PepsiCo's pricing AI works because of the optimiser, not the model -- and
  85% of what it recommends actually gets executed.
recommendation_reasoning: 'Full-text reassessment; abstract-only screen was 17/Review
  fully. The body carries the operational numbers the abstract withheld: ~85% of PromoAI''s
  recommendations accepted and executed, deployment across 7+ countries and dozens
  of markets, 16 calendar refreshes a year, planning cycles cut from weeks to minutes,
  MILP gaps held to 1-5%. Readiness to 5 -- this is not a pilot, and market onboarding
  is a documented JSON config step, not a rebuild. Story potential to 5 for Section
  5.1, which argues directly that the optimiser rather than the ML forecast is the
  value driver, a useful corrective to the prevailing assumption that enterprise AI
  value lives in the model. Evidence held at 3, not higher: the actual revenue and
  margin figures are withheld as commercially sensitive and substituted with an external
  McKinsey 2-5% industry benchmark, so the central financial claim is management attestation
  rather than measurement. Limitations are unusually honest. Not vertical-locked:
  the transferable content is the architecture and adoption playbook, so the 2607.25885
  industry-lock penalty does not apply -- and unlike that case, scale here spans dozens
  of markets and many retailers, not one operator.'
