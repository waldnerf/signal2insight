enterprise_problem: Multimodal systems are typically assembled from modality-specific
  heads and task pipelines, which blocks reuse of strong pre-trained decoder-only
  models.
headline: One symmetric model for every modality, able to check its own output against
  another.
recommendation_reasoning: 'Treating every modality as both input and output enables
  cross-modal self-verification -- scoring the model''s own output against another
  modality it generated -- which is a genuinely interesting reliability primitive
  and the reason this is not archived. Multimodal is a secondary topic, and the evidence
  is soft: ''competitive with specialist and multitask baselines'' and ''strong out-of-the-box
  performance'' without the numbers to judge. Open-sourced, so verifiable later if
  the self-verification angle becomes relevant.'
