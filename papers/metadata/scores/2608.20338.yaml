enterprise_problem: Current LLM unlearning benchmarks test isolated facts, not whether
  concept-level removal preserves benign use -- so enterprises can't tell if a compliance-driven
  unlearning pass actually worked without breaking legitimate functionality.
headline: Most LLM 'forgetting' benchmarks can't tell if you erased the right thing.
recommendation_reasoning: Solid governance-relevant benchmark work (right-to-erasure,
  safety unlearning), but it's an evaluation-methodology paper for security/compliance
  engineering teams, not yet a business-leader-ready story. Per feedback calibration,
  don't inflate C8/C9 for a benchmark whose real audience is technical.
