enterprise_problem: None directly -- this measures tactical reasoning under dense
  rule interactions using Dungeons & Dragons combat.
headline: Frontier models win the fight and lose the day.
recommendation_reasoning: 'There is a real long-horizon agent finding underneath the
  theme: models win individual encounters but fail at budgeting scarce resources across
  a linked sequence of them, which is the same failure mode as an agent that performs
  each task well and manages a multi-step engagement badly. Genuinely quotable for
  an engineering audience. But the domain is D&D combat, no enterprise reader will
  accept it as evidence about their systems, and the transfer to real agentic workloads
  is entirely my inference. The finding is worth remembering; the paper is not worth
  an enterprise reader''s time.'
