enterprise_problem: None -- convergence and regret analysis for policy gradient on
  bandits in a continuous-time diffusion setting.
headline: Almost-sure convergence at any constant learning rate, with logarithmic
  regret.
recommendation_reasoning: Continuous-time reinforcement learning theory built on stochastic
  differential equations, improving a prior analysis via a new Lyapunov function.
  Rigorous and entirely mathematical. Bandits do underlie real enterprise systems
  such as recommendation and pricing, but nothing in this paper reaches a practitioner
  -- it is an analysis technique, not a method anyone would deploy.
