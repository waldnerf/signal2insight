enterprise_problem: None -- how the choice of machine learning method affects the
  reliability of confidence intervals in causal effect estimation.
headline: More data made the confidence intervals worse, not better.
recommendation_reasoning: A simulation study of double machine learning inference,
  with one counterintuitive result worth noting -- coverage probability decreased
  as sample size grew in many settings, for both analytical and bootstrap intervals.
  That is a real caution for anyone doing causal estimation. But this is applied statistics
  and econometrics with a public-health application, not enterprise AI, and the audience
  is researchers running DML rather than any business function.
