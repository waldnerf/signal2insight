enterprise_problem: None -- generating molecules from text descriptions while respecting
  chemical constraints.
headline: Generate, verify against real constraints, then repair.
recommendation_reasoning: The generator-verifier-refiner loop is a recognisable and
  sound agent pattern, and grounding the verifier in executable domain constraints
  rather than a model's opinion is the right instinct. But the domain is computational
  chemistry, results are reported only as improved exact-match on two chemistry benchmarks
  without figures in the abstract, and nothing transfers to enterprise AI beyond a
  pattern already better demonstrated elsewhere.
