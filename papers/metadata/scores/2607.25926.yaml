headline: A survey of face de-identification from the sensor to the pixel.
recommendation_reasoning: Privacy and responsible AI touch the governance theme, and
  the observation that de-identification can be pushed into the sensor rather than
  applied after capture is a nice design point. But this is a computer-vision survey
  -- an explicit ignore topic -- with no enterprise AI systems decision attached,
  and a survey is not new evidence. Archived as adjacent rather than ignored outright,
  on the privacy-engineering angle alone.
