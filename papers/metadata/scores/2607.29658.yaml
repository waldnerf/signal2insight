enterprise_problem: Coding agents solve every repository issue from scratch, discarding
  the procedural knowledge from every repair they have already completed, so a fleet
  of agents never compounds its own experience.
headline: Your coding agents throw away everything they learn -- storing past fixes
  as reusable plans lifts a rival vendor's agent by 5 points with no code change.
recommendation_reasoning: 'Agent memory as a compounding asset, which is a priority
  topic and a decision an executive is already asking about: does our agent deployment
  get better with use, or does it restart from zero every ticket? STAIR converts past
  repair trajectories into a hierarchy of reusable plans; 81.2% Pass@1 on SWE-bench
  Verified, and crucially the plans transfer to a structurally different agent (mini-SWE-agent
  v2, 75.8% to 81.0%) with no code change. That portability is the executive point
  -- the accumulated repair knowledge is an asset independent of which agent vendor
  you use this year, which speaks directly to lock-in. Ablations support the specific
  claim (mixed abstraction levels beat any single level; raw trajectories transfer
  far worse), so the mechanism is not hand-waved. Stated without any ML vocabulary.
  Full read should check how much of the gain survives outside SWE-bench.'
