enterprise_problem: Claims that a language model has 'self-improved' are usually measured
  by noisy problem-level transitions rather than mean accuracy, and this audit shows
  several standard measurement practices manufacture false gains.
headline: Vendor claims of AI 'self-improvement' are often measurement artifacts,
  not real gains.
recommendation_reasoning: 'A rigorous, controlled audit finding seven distinct measurement
  failures that each invert a reported self-improvement finding once a proper frozen
  control is used. Directly actionable for any team evaluating vendor or internal
  claims about self-improving AI systems -- a governance and procurement-relevant
  skepticism story with a clear executive takeaway: demand a measured null before
  believing a self-improvement claim.'
