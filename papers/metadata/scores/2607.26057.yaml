enterprise_problem: Distilling a large model into a small deployable one wastes compute
  when the student commits early to a wrong reasoning path and every later token builds
  on that mistake.
headline: 'Let the teacher take the wheel at the wrong turn: cheaper distillation
  of small deployable models.'
recommendation_reasoning: Solid, well-evidenced work on small-model distillation --
  best or second-best on all eight benchmarks and over 50% shorter training trajectories,
  which is a real cost argument for teams standing up on-prem small models. But it
  is an incremental refinement of on-policy distillation evaluated only on mathematical
  reasoning, and the mechanism (prefix failure, teacher-student continuation asymmetry)
  needs explaining before an executive can see why it matters. Useful reference material
  rather than a full read.
