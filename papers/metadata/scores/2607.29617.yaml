enterprise_problem: None directly -- this is learning theory about when interactive
  expert querying beats offline imitation.
headline: Interacting with the expert lets a weaker model get away with representing
  less.
recommendation_reasoning: A clean theoretical result with matching upper and lower
  bounds -- interaction relaxes representational demands from realising the expert's
  policy to realising its value function -- and it does touch distillation, which
  enterprises care about in the abstract. But it is stated entirely in the language
  of realizability and policy classes, and there is no deployment, cost or reliability
  framing anywhere. Per C8, needing to teach value-function realizability before the
  implication lands is the signal to score this low, not to owe the explanation.
