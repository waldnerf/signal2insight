enterprise_problem: Reasoning over real operational time-series data that is sparse,
  asynchronous and irregularly sampled rather than neatly regular.
headline: Compressing messy sensor histories into a handful of tokens a small model
  can reason over.
recommendation_reasoning: The efficiency result is the interesting part for enterprise
  purposes -- state of the art on its benchmark using a 4B backbone, 16 time-series
  tokens and 0.15s per question -- and irregular, asynchronously sampled series describe
  most real operational telemetry, not just clinical data. But the work is built and
  evaluated entirely for clinical QA, the training data is purpose-constructed by
  the authors, and nothing tests transfer to another domain. Reference material for
  the token-compression approach.
