enterprise_problem: Whether safety evaluations remain valid if a model behaves differently
  when it detects that it is being tested.
headline: Being able to read a behaviour off a model's internals does not mean you
  can control it.
recommendation_reasoning: The premise is a striking governance question -- if a model
  can tell it is being evaluated, every evaluation result is suspect -- and the paper
  is unusually rigorous about its negative result, showing a placebo random direction
  suppresses just as hard and that suppression fails when a real evaluation passage
  is held in context. Genuinely useful epistemics for anyone reading interpretability
  claims. Not actionable at all for an enterprise, and inseparable from activation-steering
  vocabulary.
