human_override_reason: 'Archived at review with all five dimensions cut: novelty 3->2,
  evidence_quality 3->2, enterprise_readiness 4->2, business_translatability 4->2,
  story_potential 4->3. Key calibration: a small tool-demo paper does not earn high
  enterprise_readiness or business_translatability just because its headline finding
  is cleanly translatable. Scope (10 metamorphic relations, 4 versions, 3 transitions,
  NLP classifiers rather than LLMs) has to pull the business-fit scores down too,
  not only evidence_quality. My comparison to 2607.25891 was wrong -- that was cross-benchmark
  agent evaluation at scale; this is not the same shape.'
