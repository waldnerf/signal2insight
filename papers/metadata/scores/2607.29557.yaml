enterprise_problem: A model version upgrade can hold every aggregate benchmark number
  steady while silently changing behaviour on cases that matter, and standard release
  testing has no way to see it.
headline: The model upgrade passed every benchmark and still broke eleven things badly
  enough to block the release.
recommendation_reasoning: 'Same shape as 2607.25891, which the reviewer approved:
  an evaluation finding that warns against trusting an aggregate number, applicable
  across industries rather than locked to one. Alteron compares successive model versions
  on metamorphically transformed inputs inside CI, and found 16 behavioural regressions
  of which 11 were release-blocking -- while overall task performance was preserved.
  That is the whole argument for version-to-version behavioural testing, and it needs
  no ML vocabulary: your upgrade looked fine on the dashboard and was not fine. Evidence
  held at 3, not higher: this is a tool-demo paper with modest scope (10 metamorphic
  relations, 4 versions, 3 transitions) on NLP classifiers rather than LLMs, so whether
  it transfers to generative systems is the open question a full read should settle.
  Open source, so it is testable rather than just claimed.'
