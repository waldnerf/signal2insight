enterprise_problem: Single-turn benchmarks cannot tell you whether a model reasons
  well over a conversation where information arrives progressively and hypotheses
  must be revised.
headline: Models find plausible directions in multi-turn reasoning but rarely finish
  correctly.
recommendation_reasoning: Solidly built (1,089 real cases, 3,760 images, 15 models,
  reasoning quality scored separately from final accuracy) and the five named failure
  modes -- information synthesis failure, knowledge mapping error, perception error,
  premature closure, visual hallucination -- are a genuinely reusable vocabulary for
  auditing any multi-turn agent, premature closure especially. But the domain is clinical
  diagnosis, the audience is medical AI, and using it in an enterprise setting means
  borrowing the taxonomy rather than the benchmark. Worth keeping as reference on
  multi-turn evaluation design.
