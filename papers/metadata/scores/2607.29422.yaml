enterprise_problem: Security vulnerability backlogs grow faster than engineers can
  patch them, and generic coding agents underperform on security fixes because nobody
  gives them the context a security engineer would assemble first.
headline: Agents fix 73% of real security vulnerabilities once you give them the context
  a security engineer would have gathered first.
recommendation_reasoning: 'Patch backlog and mean-time-to-remediate are board-visible
  numbers, so a 73% automated repair rate on real vulnerabilities is a business fact
  before it is a technical one. Evidence is the strong part and survives the standard
  applied to 2607.29557: 300 real-world instances on SEC-Bench with sanitizer-based
  patch verification, not self-reported success, and 29% over the strongest baseline.
  The transferable insight is that the win came from context engineering rather than
  a better model -- cross-file data flows, runtime crash semantics, and the commit
  history that introduced the fragile pattern -- with an ablation confirming the three
  facets are complementary. That generalises to agent design well beyond security.
  Review fully rather than Priority: the contribution is an implementation insight,
  valuable but not a strategic reframing.'
