enterprise_problem: Deep learning is being deployed in high-risk domains faster than
  anyone can objectively check whether its explanations are faithful, leaving explainability
  claims unverifiable.
headline: A single score for whether an AI explanation is honest -- validated against
  what humans actually saw.
recommendation_reasoning: 'On-topic for governance and the human-validation step is
  the right instinct: the EPC score is checked against human lexical sentiment judgments
  and spatial annotations rather than only against other metrics. But it is a metric-about-metrics,
  and using it requires already running XAI tooling and caring about sparsity-versus-performance
  trade-offs -- several inferential steps from any decision a compliance officer is
  currently making. Validation spans tabular, text and image but with no indication
  of scale or of a regulated deployment actually using it. Archive rather than Ignore:
  explainability assurance is squarely in the mission and a stronger paper on it should
  be picked up, but there is nothing to act on here now.'
