enterprise_problem: Fine-tuning one model across heterogeneous tasks causes interference
  and catastrophic forgetting when a single shared adapter is used.
headline: Organising which tasks share an adapter beats making the adapter bigger.
recommendation_reasoning: 'A PEFT training-mechanics result: group and sequence tasks
  into decoupled QLoRA adaptation paths instead of one shared LoRA, reaching 44.78
  on TRACE at fixed trainable capacity. Entirely internal to the model-training loop,
  evaluated on one benchmark, with no deployment or cost framing. There is no business
  function above an ML engineering team with a reason to act on it, and the finding
  cannot be stated at all without LoRA, adapter capacity and catastrophic forgetting
  as prior concepts. Outside the enterprise-AI mission as the profile defines it.'
