enterprise_problem: LLM agents that induce and reuse skills from past tasks can transfer
  those skills unreliably, sometimes harming performance -- this identifies which
  induction choices (task- vs subtask-level, text vs code) make transfer actually
  work.
headline: Letting your AI agent 'learn from experience' can make it worse, unless
  you build memory the right way.
recommendation_reasoning: 'A controlled, actionable finding for anyone building agent
  memory/skill-reuse in production: coarse task-level skills actively hurt performance,
  subtask-level skills help. Immediately applicable design guidance with a good contrarian
  narrative for teams currently investing in agent memory.'
