enterprise_problem: Judging whether a GUI agent actually completed a task, when the
  answer depends on system state that no screenshot shows.
headline: Verifying an agent's work by inspecting the system it changed, not the screen
  it left behind.
recommendation_reasoning: 'The propose-then-verify design is sound -- state completion
  conditions, then check them by calling system and application tools rather than
  trusting a screenshot -- and 86.9% accuracy plus a downstream 34.0% OSWorld success
  rate shows it works as a training reward too. Demoted for the same reasons the reviewer
  archived Desktop-Delta Bench earlier in this run: GUI-agent evaluation is a narrow,
  platform-team concern with no business reader.'
