enterprise_problem: Proving whether a suspect model was derived from your own -- for
  IP enforcement, licence compliance, or verifying that a vendor is serving the model
  they claim.
headline: You can prove a model came from yours -- black box, no weights, no cooperation
  needed.
recommendation_reasoning: 'Model lineage is a legal and commercial question before
  it is a technical one: whether a competitor fine-tuned your weights, whether a licence
  was breached, whether the endpoint you are paying for serves the model in the contract.
  The audience includes IP counsel and procurement, not only security. Evidence is
  solid -- 0.967 AUC over 770 source-suspect pairs from 56 checkpoints, and 0.995
  AUC across 91 deployment instances, beating four baselines and holding up under
  weight transformations. Readiness held at 3 because running it requires building
  a black-box probe harness against the suspect model.'
