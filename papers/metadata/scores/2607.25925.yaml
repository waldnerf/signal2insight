enterprise_problem: Explainable representations of automated decision policies become
  too large to actually read once the system has many corner cases.
headline: Trade a measured amount of optimality for an explanation a human can actually
  finish reading.
recommendation_reasoning: The idea that explainability has a tunable price -- accept
  a bounded imprecision and get a decision tree orders of magnitude smaller, with
  the guarantee retained -- is a clean and genuinely useful governance framing, and
  'explanations too big to read are not explanations' is a good line. But it lands
  in formal verification of Markov decision processes, which needs setup before an
  enterprise audience sees the point, and the tool applies to controller synthesis
  rather than to LLM systems. Reference material on the explainability/optimality
  tradeoff.
