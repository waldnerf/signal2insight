enterprise_problem: Generating item descriptions that actually improve recommendation
  performance, without needing user data at serving time.
headline: Item descriptions written for the recommender rather than for the page.
recommendation_reasoning: 'Backed by an online A/B test with reported gains, which
  is rarer than it should be, and the design choice is commercially sensible: train
  against behavioural reward signals but keep inference content-only, so no user data
  is needed at serving time and one description serves everyone. Held at Read later
  because it is specific to live-stream recommendation and the argument needs reinforcement-learning
  framing to make sense.'
