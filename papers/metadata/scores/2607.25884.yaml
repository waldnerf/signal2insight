enterprise_problem: Inference cost and latency on constrained hardware, where quantisation
  choices are made without knowledge of the target machine.
headline: Optimal quantisation settings depend on the hardware, so choosing them before
  the compiler is wasted effort.
recommendation_reasoning: Up to 12.19x faster inference within 1.44% of baseline accuracy
  is a real cost result, and the finding that optimal policies are hardware-dependent
  is the kind of thing that invalidates a common practice. But the argument lives
  entirely in compiler passes, TOSA lowering and evolutionary search over bit-widths,
  with no reader outside a systems team. On-topic for infrastructure cost, not worth
  acting on now.
