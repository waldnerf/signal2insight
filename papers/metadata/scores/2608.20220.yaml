enterprise_problem: Legal AI benchmarks assume fully-specified queries, but real users
  omit facts that change the legal answer -- and no benchmark tests whether models
  recognize and flag that insufficiency instead of guessing.
headline: No frontier LLM reliably recognizes when it doesn't have enough facts to
  give legal advice.
recommendation_reasoning: Rigorous, attorney-annotated benchmark (202 items, 24 US
  jurisdictions) surfacing a concrete liability risk for any product deploying LLMs
  for legal Q&A -- a real evaluation checklist item for legal/compliance teams vetting
  AI tools before deployment.
