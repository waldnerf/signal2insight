enterprise_problem: Extra reasoning capacity currently costs either a bigger model
  or a longer visible chain of thought, both of which raise serving cost and latency.
headline: Buying reasoning depth without paying for reasoning tokens.
recommendation_reasoning: The cost framing is real -- decoupling how much a model
  thinks from how many tokens it emits would change inference economics -- and localising
  the recurrence to a narrow decoder interval is a sensible efficiency idea. But the
  results are hedged ('competitive accuracy at validation-selected latent budgets'),
  which usually means matching rather than beating, and the value cannot be explained
  without latent-reasoning and decoder-internals vocabulary, which caps its business
  translatability under this rubric.
