enterprise_problem: Optimising gas injection rates across wells to raise production,
  without the downhole gauges or multi-rate well tests that are usually prerequisites
  and are often too costly to install.
headline: A 5% production uplift from data the operator already had, with no new sensors
  installed.
recommendation_reasoning: 'The strongest business evidence across three batches: a
  30-well pilot delivering over 5% average production uplift, followed by full deployment
  across 200+ wells. Almost nothing in the queue gets past a pilot, let alone reports
  a production number. The techniques are unremarkable (an ML forecast of the performance
  curve plus Bayesian optimisation under capacity constraints) and novelty is scored
  accordingly, but the transferable move is the constraint they designed around --
  using historical production time series instead of requiring new instrumentation,
  which is what made it deployable. That pattern generalises to any capacity-constrained
  throughput problem where the business case dies on sensor cost.'
