enterprise_problem: Aggregate benchmark scores can certify a model as reliable while
  hiding systematic failures that appear only when the underlying evidence is vague,
  absent or contradictory.
headline: High average scores hid the failures that only appear when the evidence
  is unclear.
recommendation_reasoning: 'The transferable lesson is strong and applies to any enterprise
  evaluation: models held up under clear evidence and broke down under absent, vague
  or contradictory input, so a good aggregate score certified nothing about the conditions
  that matter. Method is careful, varying clarity, noise and consistency deliberately.
  Held back for this profile because the instrument is an elections benchmark grounded
  in a political-theory norm, so an enterprise reader has to do the whole transfer
  themselves, and the politically specific framing limits how usable it is as a business
  narrative.'
