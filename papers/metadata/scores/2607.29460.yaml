  network management -- are genuinely enterprise domains where rare extreme outcomes
  dominate, so the topic is not absurd for this profile. But the contribution is a
  regret characterisation and an exploration schedule, delivered entirely in tail
  exponents and moment bounds. Nothing reaches a practitioner.
