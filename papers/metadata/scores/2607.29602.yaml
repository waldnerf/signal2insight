enterprise_problem: None -- this measures whether models can tell if two people in
  a video already know each other.
headline: Models match human accuracy at reading social familiarity, but get there
  by guessing 'stranger'.
recommendation_reasoning: Careful work with a nice methodological point -- equal accuracy
  reached through a different prior rather than better discrimination, which is a
  real caution about reading parity from headline accuracy. But the task is social-signal
  inference from video, sitting in the profile's ignore_topics (computer vision, speech),
  with no enterprise application and 96 dyads. The transferable lesson about accuracy
  parity hiding different decision behaviour is available from papers that are already
  on-topic.
